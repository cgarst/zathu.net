<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Hexagon / Hardware Chassis -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" 
           stroke="url(#zGrad)" stroke-width="3" fill="#0b0e17" fill-opacity="0.9" />
           
  <!-- Subtle Internal Grid / String Lines -->
  <line x1="22" y1="36" x2="78" y2="36" stroke="#1f293d" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="18" y1="50" x2="82" y2="50" stroke="#1f293d" stroke-width="1.5" stroke-dasharray="2 3" />
  <line x1="22" y1="64" x2="78" y2="64" stroke="#1f293d" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Cyber 'Z' Audio Bolt / Waveform Blade -->
  <path d="M 30 30 L 72 30 L 38 68 L 74 68" 
        stroke="url(#zGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- LED Dot Accents -->
  <circle cx="30" cy="30" r="3.5" fill="#00f0ff" />
  <circle cx="74" cy="68" r="3.5" fill="#10b981" />
  <circle cx="53" cy="50" r="2.5" fill="#ec4899" />
</svg>
