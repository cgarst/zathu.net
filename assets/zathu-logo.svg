<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Chassis -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
           stroke="url(#logoGrad)" stroke-width="2.5" fill="#0b0e17" fill-opacity="0.95" />
           
  <!-- Z Symbol inside icon -->
  <path d="M 20 20 L 44 20 L 22 44 L 46 44" 
        stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
  <circle cx="20" cy="20" r="2.2" fill="#00f0ff" />
  <circle cx="46" cy="44" r="2.2" fill="#10b981" />
  <circle cx="33" cy="32" r="1.8" fill="#ec4899" />

  <!-- Typography -->
  <text x="74" y="39" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="1.2">
    <tspan fill="#f8fafc">ZATHU </tspan>
    <tspan fill="url(#logoGrad)">SOFTWARE</tspan>
  </text>
</svg>
